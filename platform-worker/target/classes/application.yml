server:
  port: 8081
  shutdown: graceful
spring:
  application:
    name: platform-worker
  cloud:
    kubernetes:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
