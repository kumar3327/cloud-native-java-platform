namespace: cloud-native-platform
imageRegistry: ghcr.io
imagePullPolicy: IfNotPresent
platformApi:
  image: example/cloud-native-platform-api
  tag: "1.0.0"
  replicas: 2
  port: 8080
  workerUrl: http://platform-worker:8081
platformWorker:
  image: example/cloud-native-platform-worker
  tag: "1.0.0"
  replicas: 2
  port: 8081
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
